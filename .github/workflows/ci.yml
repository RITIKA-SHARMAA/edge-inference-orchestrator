name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          clang-format-18 --dry-run --Werror \
            include/eio/*.h src/core/*.h src/core/*.cpp src/plugins/*.cpp \
            tools/*.h tools/*.cpp tests/*.h tests/*.cpp tests/plugins/*.cpp

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux GCC", os: ubuntu-24.04, cc: gcc, cxx: g++ }
          - { name: "Linux Clang", os: ubuntu-24.04, cc: clang, cxx: clang++ }
          - { name: "macOS Clang (arm64)", os: macos-14, cc: clang, cxx: clang++ }
          - { name: "Windows MSVC", os: windows-2022, cc: cl, cxx: cl }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Python tools (and Ninja, so every OS uses the same CMake generator)
        run: pip install -r scripts/requirements.txt ninja
      - name: Models and data (MobileNetV2, digits MLP, quantized versions)
        run: |
          python scripts/get_models.py
          python scripts/prepare_data.py
          python scripts/quantize.py
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
      - name: Build
        run: cmake --build build
      - name: C++ tests
        run: ctest --test-dir build --output-on-failure
      - name: Python binding tests
        run: python -m pytest -q python/tests
      - name: Run the example pipeline
        run: build/bin/eio_run --pipeline pipelines/example.json --input image=samples/cat.npy --labels models/imagenet_labels.txt --top 3
      - name: Quick benchmark
        run: python scripts/benchmark.py --runs 50 --warmup 10
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.os }}-${{ matrix.cc }}
          path: docs/BENCHMARK.md

  sanitizers:
    name: AddressSanitizer + UBSan (Linux GCC)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt ninja
      - run: |
          python scripts/get_models.py
          python scripts/prepare_data.py
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DEIO_SANITIZE=ON
      - run: cmake --build build
      - name: Tests under sanitizers
        run: ctest --test-dir build --output-on-failure
        env:
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/tests/lsan.supp:print_suppressions=0
          UBSAN_OPTIONS: print_stacktrace=1
